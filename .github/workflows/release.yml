# Push a tag like v3.0.0 and this builds Beam-Setup.exe and attaches it to a GitHub release.
# The join page links to releases/latest/download/Beam-Setup.exe, so friends always get the newest one,
# and installed copies find the new version through latest.yml and update themselves.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node test/push.test.mjs
        working-directory: server

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npx electron-builder --win nsis --publish never
        working-directory: desktop
      - name: Check the packaged app has its libraries
        shell: bash
        working-directory: desktop
        run: |
          npx --yes @electron/asar list dist/win-unpacked/resources/app.asar | tr '\\' '/' > files.txt
          for m in qrcode-generator electron-updater; do grep -q "node_modules/$m/package.json" files.txt || { echo "missing $m"; exit 1; }; done
          grep -q '"provider": "github"' dist/win-unpacked/resources/app-update.yml || grep -q 'provider: github' dist/win-unpacked/resources/app-update.yml
          test -f dist/latest.yml && cat dist/latest.yml
      - uses: actions/upload-artifact@v4
        with:
          name: Beam-Setup
          path: |
            desktop/dist/Beam-Setup.exe
            desktop/dist/Beam-Setup.exe.blockmap
            desktop/dist/latest.yml
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Beam $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          # latest.yml is what installed copies check to update themselves.
          gh release upload "$GITHUB_REF_NAME" desktop/dist/Beam-Setup.exe desktop/dist/Beam-Setup.exe.blockmap desktop/dist/latest.yml --clobber
